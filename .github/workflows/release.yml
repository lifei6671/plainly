name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server deployment assets
        run: VITE_DATA_STORE=remote VITE_API_BASE=/api pnpm build:node
      - name: Stage server deployment package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:package server "$RELEASE_TAG"
      - name: Smoke test staged server package
        working-directory: release
        run: |
          cd "$(node -p 'require("./package-result.json").stageName')"
          npm ci --no-audit --no-fund
          node -e "require('./server/server/index.js')"
          node -e "const Database = require('better-sqlite3'); new Database(':memory:').close()"
          rm -rf node_modules
      - name: Archive server deployment package
        working-directory: release
        run: zip -r "../$(node -p 'require("./package-result.json").archiveName')" "$(node -p 'require("./package-result.json").stageName')"
      - name: Upload server release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-server-web
          path: plainly-server-*.zip
          if-no-files-found: error

  web-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker deployment assets
        run: VITE_DATA_STORE=remote VITE_API_BASE=/api pnpm build:cf
      - name: Stage Worker deployment package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:package worker "$RELEASE_TAG"
      - name: Smoke test staged Worker package
        working-directory: release
        run: |
          cd "$(node -p 'require("./package-result.json").stageName')"
          npm ci --no-audit --no-fund
          cp wrangler.toml wrangler.smoke.toml
          sed -i 's/<YOUR_D1_DATABASE_NAME>/plainly-smoke/g; s/<YOUR_D1_DATABASE_ID>/00000000-0000-0000-0000-000000000000/g' wrangler.smoke.toml
          npx --yes wrangler deploy --dry-run --config wrangler.smoke.toml
          rm wrangler.smoke.toml
          rm -rf node_modules .wrangler
      - name: Archive Worker deployment package
        working-directory: release
        run: zip -r "../$(node -p 'require("./package-result.json").archiveName')" "$(node -p 'require("./package-result.json").stageName')"
      - name: Upload Worker release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-worker-web
          path: plainly-cloudflare-worker-*.zip
          if-no-files-found: error

  release:
    needs: [web-server, web-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-web
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release once
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
